<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FAF5EC" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_IMAGE%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html,body{margin:0;background:#FAF5EC}
      .boot{height:100vh;height:100svh;display:grid;place-items:center}
      .boot i{width:46px;height:62px;border:1.5px solid #D8B2AA;border-radius:46px 46px 0 0;animation:b 1.6s ease-in-out infinite alternate}
      @keyframes b{from{opacity:.25}to{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><i></i></div></div>
    <noscript><p style="font:1.2rem Georgia,serif;padding:2rem;text-align:center">Esta página necesita JavaScript para mostrarse.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
